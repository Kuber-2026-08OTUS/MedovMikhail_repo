apiVersion: v1
kind: Pod
metadata:
  name: homework-pod
  namespace: homework
spec:
  containers:
  - name: homework-container
    image: busybox
    ports: 
      - containerPort: 8000
    volumeMounts:
      - mountPath: /homework
        name: homework-volume
    command:
      - /bin/sh
      - -c
      - |
        httpd -f -p 8000 -h /homework
    lifecycle:
      preStop:
        exec:
          command:
            - /bin/sh
            - -c
            - |
              rm -f /homework/index.html
  initContainers:
  - name: homework-init
    image: busybox
    env:
      - name: INDEX_URL
        value: "https://dadata.ru/suggestions/"
    volumeMounts:
      - name: homework-volume
        mountPath: /init
    command:
      - /bin/sh
      - -c
      - |
        wget -O /init/index.html "$INDEX_URL"
  volumes:
  - name: homework-volume
    emptyDir: {}
